# Nginx Server Block for tasbeeh.cybeasy.com
server {
    listen 80;
    listen [::]:80;
    server_name tasbeeh.cybeasy.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tasbeeh.cybeasy.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/tasbeeh.cybeasy.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tasbeeh.cybeasy.com/privkey.pem;

    root /media/khaled/791EE05A1040BCCE/DATA 2025/DATA 2025/work/CYBEASY/Development/Tasbeeh-Al-Muslim/dist;
    index index.html index.php;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1000;

    # Static Assets & WASM MIME Types
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API v3 PHP Execution
    location ^~ /api/v3/ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Origin, Accept" always;

        if ($request_method = "OPTIONS") {
            return 200;
        }
    }

    # Flutter Web SPA Routing: Any non-file route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
