<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="تطبيق تسبيح المسلم لعرض وسماع الأذكار اليومية والأدعية والسبحة الإلكترونية">
  <meta name="theme-color" content="#1B4D3E">

  <!-- Cache Control Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="app-build-id" content="{{BUILD_ID}}">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="تسبيح المسلم">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v={{BUILD_ID}}">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v={{BUILD_ID}}">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v={{BUILD_ID}}">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v={{BUILD_ID}}">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v={{BUILD_ID}}">
  <link rel="shortcut icon" href="favicon.ico?v={{BUILD_ID}}">

  <title>تسبيح المسلم - أذكار وسبحة إلكترونية</title>
  <link rel="manifest" href="manifest.json?v={{BUILD_ID}}">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1510;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #e2f1e8;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(27, 77, 62, 0.3);
      border-radius: 50%;
      border-top-color: #2e8b57;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .app-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="app-title">تسبيح المسلم</div>
  </div>
  <script>
    (function() {
      var buildId = "{{BUILD_ID}}";
      try {
        var prevBuildId = localStorage.getItem('tasbeeh_app_build_id');
        if (prevBuildId && prevBuildId !== buildId) {
          console.log('[CacheBuster] New version detected: ' + buildId + ' (was ' + prevBuildId + '). Clearing caches...');
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
        }
        localStorage.setItem('tasbeeh_app_build_id', buildId);
      } catch (e) {
        console.warn('[CacheBuster] Error checking cache:', e);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js?v={{BUILD_ID}}" async></script>
</body>
</html>
